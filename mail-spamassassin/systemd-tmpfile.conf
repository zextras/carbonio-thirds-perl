# SpamAssassin data directories
# See tmpfiles.d(5) for format

d /opt/zextras/data/spamassassin 0755 zextras zextras
Z /opt/zextras/data/spamassassin/localrules 0755 zextras zextras
Z /opt/zextras/data/spamassassin/rules 0755 zextras zextras
# Runtime sa-update state dir (LOCAL_STATE_DIR); zextras-owned so sa-update can write it
d /opt/zextras/data/spamassassin/state 0755 zextras zextras
